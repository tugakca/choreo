org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:ReservedCodeCacheSize=320m -Xmx3g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build features that no module uses
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Needed by binary-compatibility-validator, which only understands the Kotlin Android plugin.
android.builtInKotlin=false
android.newDsl=false

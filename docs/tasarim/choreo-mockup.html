<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,sans-serif;background:#E6E4EC;padding:24px;width:1432px;color:#222}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-size:24px;line-height:1;font-variation-settings:'FILL' 0;display:inline-block;flex:none}
.fill{font-variation-settings:'FILL' 1}
.row{display:flex;gap:24px;margin-bottom:24px;align-items:flex-start}
.cell{width:440px}.cell h3{font-size:15px;margin:0 0 8px;color:#222}
.legend{font-size:12.5px;line-height:1.45;margin-top:10px;color:#333}.legend b{color:#000}
.n{display:inline-flex;width:18px;height:18px;border-radius:9px;background:#E8590C;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;vertical-align:middle;margin-right:5px;flex:none}
.pin{position:absolute;z-index:9;box-shadow:0 0 0 2px #fff}
.phone{position:relative;width:412px;height:915px;overflow:hidden;border-radius:28px;display:flex;flex-direction:column;background:var(--bg);color:var(--on);--k:1;box-shadow:0 2px 12px #0003}
.phone.fs{--k:1.5}
.light{--bg:#FAF8FF;--on:#1B1B21;--onv:#45464F;--sub:#5C5E6B;--pr:#3B5BDB;--onpr:#fff;--prc:#DDE1FF;--onprc:#00164E;--sc:#EFEDF4;--sch:#E9E7EF;--scl:#fff;--ov:#C6C6D0;--ol:#757680;--tert:#A23B72;--ok:#1B6B3A;--code:#F1EFF7}
.dark{--bg:#121318;--on:#E3E1E9;--onv:#C6C6D0;--sub:#B0B1BD;--pr:#B7C4FF;--onpr:#0B2A8F;--prc:#2D4296;--onprc:#DDE1FF;--sc:#1F1F25;--sch:#292A2F;--scl:#0D0E13;--ov:#46464F;--ol:#90909A;--tert:#FFB0D0;--ok:#7FD9A0;--code:#1A1B21}
.tl{font-size:calc(22px*var(--k));line-height:1.27}.ts{font-size:calc(16px*var(--k));font-weight:500;line-height:1.5}
.bm{font-size:calc(14px*var(--k));line-height:1.43}.bs{font-size:calc(12px*var(--k));line-height:1.33}.lm{font-size:calc(12px*var(--k));font-weight:500;line-height:1.33}.ll{font-size:calc(14px*var(--k));font-weight:500;line-height:1.43}
.mono{font-family:'Roboto Mono',monospace}
.sb{height:24px;flex:none;display:flex;justify-content:space-between;padding:6px 20px 0;font-size:12px;color:var(--on)}
.tb{height:64px;flex:none;display:flex;align-items:center;padding:0 4px 0 16px;gap:8px;min-height:64px}
.tb .t{flex:1}
.ib{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--onv);flex:none}
.body{flex:1;overflow:hidden;position:relative;padding:0 16px}
.nav{height:80px;flex:none;background:var(--sch);display:flex;padding:12px 8px 16px;position:relative}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--onv)}
.nav .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav .on .pill{background:var(--prc);color:var(--onprc)}.nav .on{color:var(--on)}
.nav .lm{font-size:calc(12px*1)}
.gest{position:absolute;bottom:6px;left:50%;margin-left:-67px;width:134px;height:4px;border-radius:2px;background:var(--on);opacity:.6}
.chip{height:32px;border-radius:8px;border:1px solid var(--ol);padding:0 12px;display:inline-flex;align-items:center;gap:6px;color:var(--onv);white-space:nowrap}
.chip.s{background:var(--prc);color:var(--onprc);border-color:transparent}
.stage{border-radius:16px;background:var(--scl);border:1px solid var(--ov);position:relative;overflow:hidden;background-image:radial-gradient(var(--ov) 1px,transparent 1px);background-size:16px 16px}
.card{border-radius:12px;background:var(--sc);border:1px solid var(--ov);overflow:hidden}
.code{background:var(--code);border-radius:12px;padding:10px 12px;font-family:'Roboto Mono',monospace;font-size:calc(12px*var(--k));line-height:1.55;color:var(--on);white-space:pre;overflow:hidden}
.kw{color:var(--pr)}.fn{color:var(--tert)}.hl{background:var(--prc);display:block;margin:0 -12px;padding:0 12px}
.fab{width:56px;height:56px;border-radius:16px;background:var(--pr);color:var(--onpr);display:flex;align-items:center;justify-content:center}
.tonal{background:var(--prc);color:var(--onprc);border-radius:20px;height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:8px}
.sl{position:relative;height:48px;display:flex;align-items:center}
.sl i{position:absolute;left:0;right:0;height:16px;border-radius:8px;background:var(--prc)}
.sl i b{position:absolute;left:0;top:0;bottom:0;border-radius:8px 2px 2px 8px;background:var(--pr)}
.sl u{position:absolute;width:4px;height:44px;border-radius:2px;background:var(--pr);top:2px}
.seg{display:flex;border:1px solid var(--ol);border-radius:20px;overflow:hidden;height:40px}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-right:1px solid var(--ol);color:var(--onv)}
.seg span:last-child{border:0}.seg .s{background:var(--prc);color:var(--onprc)}
.tabs{height:48px;display:flex;flex:none;border-bottom:1px solid var(--ov)}
.tabs div{flex:1;display:flex;align-items:center;justify-content:center;color:var(--onv);position:relative}
.tabs .s{color:var(--pr)}.tabs .s:after{content:"";position:absolute;bottom:-1px;left:20%;right:20%;height:3px;background:var(--pr);border-radius:3px 3px 0 0}
.hero{width:1280px;height:640px;background:#121318;position:relative;overflow:hidden;color:#E3E1E9;transform-origin:0 0}
</style></head><body>
<script>
const q=new URLSearchParams(location.search).get('only');
function star(cx,cy,R,r,n){let p=[];for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,d=i%2?r:R;p.push((cx+d*Math.cos(a)).toFixed(1)+','+(cy+d*Math.sin(a)).toFixed(1))}return p.join(' ')}
const C='var(--pr)',T='var(--tert)';
const shapes={
 circle:`<circle cx="50" cy="32" r="21" fill="${C}"/>`,
 rect:`<rect x="26" y="14" width="48" height="36" fill="${C}"/>`,
 rrect:`<rect x="24" y="14" width="52" height="36" rx="12" fill="${T}"/>`,
 line:`<path d="M20 48L80 16" stroke="${C}" stroke-width="6" stroke-linecap="round"/>`,
 poly:`<polygon points="${star(50,32,23,23,3).split(' ').length?'50,8 72,20 72,44 50,56 28,44 28,20':''}" fill="${T}"/>`,
 star:`<polygon points="${star(50,33,25,11,5)}" fill="${C}"/>`,
 path:`<path d="M22 38C28 8 46 10 50 30S72 56 78 26" fill="none" stroke="${T}" stroke-width="5" stroke-linecap="round"/>`,
 svg:`<path d="M24 46L38 18L50 40L62 18L76 46Z" fill="none" stroke="${C}" stroke-width="5" stroke-linejoin="round"/>`
};
function sh(k){return `<svg viewBox="0 0 100 64" width="100%" height="100%" role="img">${shapes[k]}</svg>`}
function gcard(k,title,code,eff){return `<div class="card" style="width:calc(50% - 6px)"><div class="stage" style="height:96px;border:0;border-radius:0;border-bottom:1px solid var(--ov)">${sh(k)}<div class="ib" style="position:absolute;right:0;bottom:0;width:48px;height:48px"><span class="ms" style="font-size:20px">replay</span></div></div><div style="padding:8px 12px 10px"><div class="ll">${title}</div><div class="mono bs" style="color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden">${code}</div></div></div>`}
function status(t){return `<div class="sb"><span>${t||'9:41'}</span><span>●●●</span></div>`}
function nav(i){const it=[['grid_view','Gallery'],['account_tree','Sequences'],['tune','Playground'],['motion_photos_off','Motion']];return `<div class="nav">${it.map((x,j)=>`<div class="${j==i?'on':''}"><span class="pill"><span class="ms ${j==i?'fill':''}">${x[0]}</span></span><span class="lm">${x[1]}</span></div>`).join('')}<span class="gest"></span></div>`}
function transport(pct,time){return `<div style="display:flex;align-items:center;gap:4px"><div class="ib"><span class="ms">replay</span></div><div class="fab" style="width:48px;height:48px;border-radius:24px"><span class="ms fill">pause</span></div><div class="sl" style="flex:1;margin:0 4px"><i><b style="width:${pct}%"></b></i><u style="left:calc(${pct}% - 2px)"></u></div><span class="bs mono" style="min-width:64px;text-align:right;color:var(--onv)">${time}</span></div>`}
function frame(id,cls,title,legend,inner){if(q&&q!==id)return;document.write(`<div class="cell" id="${id}"><h3>${title}</h3><div class="phone ${cls}">${inner}</div>${q?'':`<div class="legend">${legend}</div>`}</div>`)}
</script>

<div class="row">
<script>
// A GALLERY
frame('A','light','A · Gallery (açık)',
`<span class="n">1</span><b>Çok ekranlı, 4 hedefli Navigation bar</b> (3-5 kuralı, M3 nav bar guidelines): Gallery, Sequences, Playground, Motion. Görevler farklı, galeri başlangıç.<br>
<span class="n">2</span><b>Top app bar'da kalıcı “Tümünü duraklat”</b>: WCAG 2.2.2; 48dp ikon düğmesi, seçilince ikon play olur.<br>
<span class="n">3</span><b>Kartlar tek sefer oynar</b> (döngü yok), köşede 48dp yeniden oynat; yanıp sönme riski ve duraklat yükü azalır (WCAG 2.2.2/2.3.1).<br>
<span class="n">4</span><b>Canlı önizleme + tek satır kod</b> (monospace, Roboto Mono): geliştirici “ne yazarım” sorusunu kartta görür; karta dokunmak Playground'u o şekille açar.<br>
<span class="n">5</span><b>Filter chip'ler</b> Shapes / Animations ayrımı (M3 filter chip, 32dp görsel, 48dp dokunma alanı).`,
`${status()}
<div class="tb"><span class="t ts" style="font-size:22px;font-weight:500;display:flex;align-items:center;gap:8px"><svg width="28" height="28" viewBox="0 0 32 32"><path d="M25 9A11 11 0 1 0 25 23" fill="none" stroke="var(--pr)" stroke-width="4.5" stroke-linecap="round"/><circle cx="26" cy="16" r="2.6" fill="var(--tert)"/></svg>Choreo</span><div class="ib"><span class="ms">pause_circle</span></div><div class="ib"><span class="ms">code</span></div></div>
<div class="body"><div style="display:flex;gap:8px;margin:4px 0 14px"><span class="chip s"><span class="ms" style="font-size:18px">check</span><span class="lm">Shapes · 8</span></span><span class="chip"><span class="lm">Animations · 7</span></span></div>
<div style="display:flex;flex-wrap:wrap;gap:12px">
${gcard('circle','Circle','circle(r = 24.dp)')}${gcard('rect','Rectangle','rect(48.dp, 36.dp)')}${gcard('rrect','Rounded rect','roundRect(radius=12.dp)')}${gcard('line','Line','line(from, to)')}${gcard('poly','Polygon','polygon(sides = 6)')}${gcard('star','Star','star(points = 5)')}${gcard('path','Path','path(composePath)')}${gcard('svg','SVG path-data','svgPath("M24 46…")')}</div>
<span class="pin n" style="left:6px;top:-48px;display:none"></span></div>
${nav(0)}
<span class="pin n" style="left:150px;top:40px">1</span><span class="pin n" style="right:60px;top:30px">2</span><span class="pin n" style="left:190px;top:244px">3</span><span class="pin n" style="left:20px;top:206px;display:none"></span><span class="pin n" style="left:30px;top:300px">4</span><span class="pin n" style="left:262px;top:112px">5</span><span class="pin n" style="left:30px;top:848px">1</span>`);
// B SEQUENCES
frame('B','light','B · Sequences (açık)',
`<span class="n">1</span><b>Primary tabs</b> Sequence / Parallel / Nested / Logo: aynı sahne, farklı koreografi (M3 tabs, 48dp).<br>
<span class="n">2</span><b>Sahne</b>: dot-grid zemin (kağıt hissi), şekiller ana renk + tertiary; hareket izi hayalet olarak gösterilir.<br>
<span class="n">3</span><b>Zaman çizelgesi</b> satır başına bir animasyon; sequence ardışık, parallel hizalı barlar. Oynatma başlığı = primary çizgi. Hareketin “neden” sırada olduğunu görünür kılar (ürünün farkı: tek kontrol edilebilir timeline).<br>
<span class="n">4</span><b>Transport</b>: restart, play/pause (48dp), seek slider (M3 slider, 16dp track), süre. Her zaman görünür (WCAG 2.2.2).<br>
<span class="n">5</span><b>Aktif satırı vurgulanan kod</b>: şu an oynayan satır prc zeminde; kod ile hareket bağlanır.`,
`${status()}
<div class="tb"><span class="t ts" style="font-size:22px;font-weight:500">Sequences</span><div class="ib"><span class="ms">pause_circle</span></div></div>
<div class="tabs"><div class="s ll">Sequence</div><div class="ll">Parallel</div><div class="ll">Nested</div><div class="ll">Logo</div></div>
<div class="body" style="padding-top:16px">
<div class="stage" style="height:210px"><svg viewBox="0 0 380 210" width="100%" height="100%" role="img" aria-label="Circle moves right, square scales, star rotates">
<circle cx="70" cy="105" r="22" fill="var(--pr)" opacity=".25"/><path d="M70 105H200" stroke="var(--pr)" stroke-dasharray="4 5" opacity=".6"/><circle cx="200" cy="105" r="22" fill="var(--pr)"/>
<rect x="258" y="73" width="52" height="52" rx="10" fill="var(--tert)" opacity=".3" transform="rotate(8 284 99)"/><rect x="262" y="77" width="44" height="44" rx="8" fill="none" stroke="var(--tert)" stroke-width="3" stroke-dasharray="6 5"/>
<polygon points="${star(320,160,0,0,5)}"/><polygon points="${star(120,160,18,8,5)}" fill="var(--onv)" opacity=".35"/></svg></div>
<div style="margin-top:10px">${transport(42,'0.84 / 2.0 s')}</div>
<div class="card" style="margin-top:8px;padding:12px 12px 8px"><div class="lm" style="color:var(--onv);margin-bottom:8px">Timeline · sequence</div>
<div style="position:relative">
<div style="display:flex;align-items:center;height:28px"><span class="bs mono" style="width:64px">moveTo</span><div style="flex:1;position:relative;height:16px"><b style="position:absolute;left:0;width:36%;height:16px;border-radius:4px;background:var(--pr)"></b></div></div>
<div style="display:flex;align-items:center;height:28px"><span class="bs mono" style="width:64px">scaleTo</span><div style="flex:1;position:relative;height:16px"><b style="position:absolute;left:36%;width:30%;height:16px;border-radius:4px;background:var(--tert)"></b></div></div>
<div style="display:flex;align-items:center;height:28px"><span class="bs mono" style="width:64px">rotateTo</span><div style="flex:1;position:relative;height:16px"><b style="position:absolute;left:66%;width:34%;height:16px;border-radius:4px;background:var(--onv);opacity:.7"></b></div></div>
<div style="position:absolute;left:calc(64px + (100% - 64px)*.42);top:-4px;bottom:0;width:2px;background:var(--pr)"></div></div></div>
<div class="code" style="margin-top:8px"><span class="kw">val</span> c = <span class="fn">rememberChoreography</span> {
  <span class="fn">sequence</span> {
<span class="hl">    circle.moveTo(x = 120.dp, 800.ms)</span>    square.scaleTo(1.4f, 600.ms)
    star.rotateTo(180f, 700.ms)
  }
}</div></div>
${nav(1)}
<span class="pin n" style="left:6px;top:92px">1</span><span class="pin n" style="left:22px;top:150px">2</span><span class="pin n" style="left:22px;top:410px">3</span><span class="pin n" style="left:22px;top:336px">4</span><span class="pin n" style="left:22px;top:612px">5</span>`);
// C PLAYGROUND
frame('C','light','C · Playground (açık)',
`<span class="n">1</span><b>Sahne + transport üstte sabit</b>, parametreler kayar: duraklat/seek hep erişilebilir; büyük yazıda da (bkz. E).<br>
<span class="n">2</span><b>Animasyon seçimi</b>: choice-style filter chip satırı (yatay kayar), 7 efekt.<br>
<span class="n">3</span><b>Duration/Delay</b>: M3 slider, değer etiketi ms (Roboto Mono). <b>Easing</b>: açılır menü (exposed dropdown) çünkü 6+ seçenek, segmented 5'i aşmamalı.<br>
<span class="n">4</span><b>Repeat</b>: segmented button 1× / 3× / ∞. ∞ seçilince sahnede “Sürekli: duraklat” uyarısı yerine transport zaten görünür; ∞ varsayılan değil.<br>
<span class="n">5</span><b>Canlı üretilen kod + Kopyala</b>: parametreler değişince kod güncellenir; “bağımlılık → ilk animasyon” hedefi (analiz Bölüm 1).`,
`${status()}
<div class="tb"><span class="t ts" style="font-size:22px;font-weight:500">Playground</span><div class="ib"><span class="ms">pause_circle</span></div></div>
<div style="padding:0 16px;flex:none"><div class="stage" style="height:170px"><svg viewBox="0 0 380 170" width="100%" height="100%" role="img" aria-label="Star outline being drawn"><polygon points="${star(190,88,60,26,5)}" fill="none" stroke="var(--pr)" stroke-width="5" stroke-linejoin="round" stroke-dasharray="330 140" stroke-linecap="round"/></svg>
<div class="chip" style="position:absolute;left:8px;top:8px;height:24px;border-color:transparent;background:var(--sch)"><span class="bs mono">drawOn · 1200 ms</span></div></div>
<div style="margin-top:6px">${transport(58,'0.70 / 1.2 s')}</div></div>
<div class="body" style="padding-top:6px"><div class="lm" style="color:var(--onv);margin-bottom:4px">Animation</div>
<div style="display:flex;gap:8px;margin-bottom:6px;overflow:hidden"><span class="chip s"><span class="lm">drawOn</span></span><span class="chip"><span class="lm">eraseOff</span></span><span class="chip"><span class="lm">moveTo</span></span><span class="chip"><span class="lm">scaleTo</span></span><span class="chip"><span class="lm">rotateTo</span></span></div>
<div style="display:flex;justify-content:space-between" class="ll"><span>Duration</span><span class="mono" style="color:var(--pr)">1200 ms</span></div><div class="sl"><i><b style="width:38%"></b></i><u style="left:38%"></u></div>
<div style="display:flex;justify-content:space-between" class="ll"><span>Delay</span><span class="mono" style="color:var(--pr)">0 ms</span></div><div class="sl"><i><b style="width:0"></b></i><u style="left:0"></u></div>
<div style="display:flex;gap:12px;align-items:center;margin:2px 0 8px"><div style="flex:1;border:1px solid var(--ol);border-radius:4px;height:48px;padding:0 12px;display:flex;align-items:center;justify-content:space-between"><div><div class="bs" style="color:var(--onv);font-size:11px">Easing</div><div class="bm">FastOutSlowIn</div></div><span class="ms">arrow_drop_down</span></div></div>
<div class="seg"><span class="s"><span class="ms" style="font-size:18px">check</span>1×</span><span>3×</span><span>∞</span></div>
<div class="code" style="margin-top:10px;position:relative"><span class="fn">star</span>.<span class="fn">drawOn</span>(
  duration = 1200.ms,
  easing = FastOutSlowInEasing)<span class="ms" style="position:absolute;right:12px;top:10px;color:var(--onv)">content_copy</span></div></div>
${nav(2)}
<span class="pin n" style="left:6px;top:130px">1</span><span class="pin n" style="left:6px;top:330px">2</span><span class="pin n" style="left:150px;top:400px">3</span><span class="pin n" style="left:6px;top:556px">4</span><span class="pin n" style="left:6px;top:660px">5</span>`);
</script></div>

<div class="row">
<script>
// D MOTION (dark)
frame('D','dark','D · Motion / reduced motion (koyu)',
`<span class="n">1</span><b>Sistem durumu kartı</b>: “Animasyonları kaldır / ölçek 0×” algısını gösterir; ikon + metin (renkle tek başına anlatılmaz).<br>
<span class="n">2</span><b>Politika</b>: radio listesi (Follow system varsayılan, Always play, Always final frame); 56dp satır, tek dokunuşla seçilir.<br>
<span class="n">3</span><b>Yan yana önizleme</b>: solda animasyon (kendi pause'u), sağda aynı koreografinin son karesi. Kural: reduced iken demolar son kareyi gösterir (analiz Bölüm 10).<br>
<span class="n">4</span><b>“Open system settings”</b> tonal düğme: ayarı değiştirme yolu uygulama içinden.<br>
<span class="n">5</span><b>Koyu tema</b>: tonal yüzeyler (surface container), primary açık mavi #B7C4FF; sahne zemini scl koyu, kontrast &gt;10:1.`,
`${status()}
<div class="tb"><span class="t ts" style="font-size:22px;font-weight:500">Motion</span></div>
<div class="body" style="padding-top:8px">
<div class="card" style="padding:16px;display:flex;gap:16px;background:var(--prc);border:0;color:var(--onprc)"><span class="ms fill" style="font-size:32px">motion_photos_off</span><div><div class="ts">System: animations off</div><div class="bm" style="margin-top:4px">Animator duration scale is 0×. Choreo shows the final frame.</div></div></div>
<div class="lm" style="color:var(--onv);margin:20px 0 4px">Reduced-motion policy</div>
<div style="display:flex;align-items:center;height:56px;gap:16px"><span class="ms fill" style="color:var(--pr)">radio_button_checked</span><div><div class="bm" style="font-size:16px">Follow system</div><div class="bs" style="color:var(--sub)">Default</div></div></div>
<div style="display:flex;align-items:center;height:56px;gap:16px"><span class="ms" style="color:var(--onv)">radio_button_unchecked</span><div class="bm" style="font-size:16px">Always play</div></div>
